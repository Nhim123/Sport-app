services:
  app:
    build: ./server
    container_name: sportapp-api
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      PORT: "4000"
      MONGODB_URI: mongodb://mongo:27017/sportapp
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-dev_secret_change_me}
      JWT_EXPIRES_IN: 7d
    depends_on:
      - mongo
      - redis

  gateway:
    build: ./server
    container_name: sportapp-gateway
    restart: unless-stopped
    command: ["node", "dist/gateway.js"]
    ports:
      - "8080:8080"
    environment:
      GATEWAY_PORT: "8080"
      GATEWAY_TARGET: http://app:4000
      JWT_SECRET: ${JWT_SECRET:-dev_secret_change_me}
    depends_on:
      - app

  mongo:
    image: mongo:7
    container_name: sportapp-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7-alpine
    container_name: sportapp-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  mongo_data:
  redis_data:
